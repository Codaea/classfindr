services:
  db:
    image: postgres:17.2
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5400:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - 8090:8080
volumes:
  data:
    external: true
